<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>자바스크립트 함수 테스트</title>
</head>
<body>
	<h1>자바스크립트 테스트중...</h1>
	<button id="startButton">게임시작</button>
	<button class="endButton">게임종료</button>
	<hr />
	<p>
	  <input
	      id="greeting" 
	  	  type="text"
	  	  placeholder="인사말을 입력하세요"></p>
	<p id="message">값없음</p>
	<button id="copyButton">값복사</button>
	
	<section class="card">
	  <h1>클릭 점수 게임</h1>
	  <p>현재 점수</p>
	  <p id="score">0</p>
	  <button id="clickButton">눌러 주세요!</button>
	  <p id="message">게임을 시작해 보세요.</p>
	  <button id="resetButton">다시 시작</button>	
	</section>
	
	<script src="./js/js2.js"></script>
</body>
</html>
