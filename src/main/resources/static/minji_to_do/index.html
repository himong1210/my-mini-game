<!DOCTYPE html>
<html lang="ko">
<head>
	<meta charset="UTF-8">
	<title>토이 1호: 첫 웹페이지</title>
	<link rel="stylesheet" href="css/style.css">
	<!-- 외부파일 js -->
	
</head>
<body>
	<section>
	<h1>나의 첫 웹페이지</h1>
	<p>웹 개발을 시작했습니다!</p>
	<!--  <b>: 굵은 단어 -->
	<p>오늘은 <b>좋은 날</b> 입니다.</p>
	</section>
	<section>
	  <h2>오늘 할 일</h2>
	  <!-- 리스트 만들기 -->
	  <ul>  <!-- 리스트 틀 -->
	    <li>책 읽기</li>  <!-- 현재 리스트의 항목 한개 -->
	    <li>산책하기</li>  <!-- 현재 리스트의 두번째 항목 -->
	    <li>영화보기</li>
	    <li>게임하기</li>
	  </ul>
	  <!-- 03. 입력창과 버튼 만들기 -->
	   <label for="nickname">별명</label>
	   <input 
	     id="nickname" 
	     type="text" 
	     placeholder="별명을 입력하세요">
	   <button type="button" id="helloButton">
	   인사하기</button>
	 </section>
	 <!-- <section> 대신에 <div>...</div> 사용  -->
	 
	 <script type="text/javascript">
	 // 여기서부터는 태크나라가 아니라
	 //자바스크립트 나라입니다.
	 //절대로 이안에서는 <..> 쓰시면 안됩니다
	 // script>.../script 바깥에서만 쓰세요.
	 
	   // 함수 정의
	   // function 함수면(입력 매개변수){
	   //   입력매개변수를 사용한 처리문...
	   // }
	   // function sayHello(){
	   //   alert("반가워요!");
	   // }
	  // sayHello();

	 </script>
	 
	 <div class="card">
	   <h2>🧀 오늘의 할 일 🧀</h2>
	   <p>오늘도 열심히 공부했어요</p>
	   
	   <div>
	      <input 
	         type="text"
	         id="taskInput"
	         placeholder="할일을 입력하세요">
	         <button id ="addButton">추가하기</button>
	   </div>
	   <!-- 입력상자에서 입력한 할일 추가 -->
	     <ul id="taskList">
	     </ul>
	 </div>
	   <hr>
	   <div id="result">행운을 뽑아봅시다.</div>
	   
	     <button onclick="drawFortune()">행운 뽑기</button>
	     <button onclick="saveFortune()">행운 저장</button>
	     <button onclick="loadFortune()">저장된 행운 불러오기</button>
	     <button onclick="deleteFortune()">저장 삭제</button>
	   
	   <!-- 12. 객체와 배열 -->
	   <div class="card">
	     <button id="button1">첫번째 배열 요소값 출력</button>
	     <button id="button2">두번째 배열 요소값 출력</button>
	     <button id="button3">세번째 배열 요소값 출력</button>
	     <button id="button4">네번째 배열 요소값 출력</button>
	     <button id="button5">다섯번째 배열 요소값 출력</button>
	   </div>
	   
	   <script src="js/app.js"></script>
	   
	   <!-- 
	      1. css 화면을 꾸미는 아이
	      2. html 태그는 구조를 만드는 아이
	         css파일 다음에 와야함.
	      3. js는 html 구조가 만들어져야 작동함.
	         따라서 '</body>' 태그 바로 위에 오는 것이 좋음
	     -->
</body>
</html>
